<svg width="460" height="210" viewBox="0 0 460 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="460" height="210" rx="10" fill="#0a1a26"/>
  <text x="16" y="24" font-family="Fira Code, monospace" font-size="14" font-weight="700" fill="#00c6ff">Most Used Languages</text>
  <g transform="translate(16,0)">
    
    <text x="0" y="56" font-family="Fira Code, monospace" font-size="13" fill="#c9d6de">JavaScript</text>
    <rect x="120" y="40" width="220" height="22" rx="5" fill="#0d2230"/>
    <rect x="120" y="40" height="22" rx="5" fill="#f1e05a" width="0">
      <animate attributeName="width" from="0" to="220" dur="1.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="350" y="56" font-family="Fira Code, monospace" font-size="12" fill="#8ea9b8">32%</text>
    <text x="0" y="88" font-family="Fira Code, monospace" font-size="13" fill="#c9d6de">PHP</text>
    <rect x="120" y="72" width="220" height="22" rx="5" fill="#0d2230"/>
