      <animate attributeName="width" from="0" to="165" dur="1.2s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="350" y="88" font-family="Fira Code, monospace" font-size="12" fill="#8ea9b8">24%</text>
    <text x="0" y="120" font-family="Fira Code, monospace" font-size="13" fill="#c9d6de">Python</text>
    <rect x="120" y="104" width="220" height="22" rx="5" fill="#0d2230"/>
    <rect x="120" y="104" height="22" rx="5" fill="#3572A5" width="0">
      <animate attributeName="width" from="0" to="137.5" dur="1.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="350" y="120" font-family="Fira Code, monospace" font-size="12" fill="#8ea9b8">20%</text>
    <text x="0" y="152" font-family="Fira Code, monospace" font-size="13" fill="#c9d6de">Go</text>
    <rect x="120" y="136" width="220" height="22" rx="5" fill="#0d2230"/>
    <rect x="120" y="136" height="22" rx="5" fill="#00ADD8" width="0">
      <animate attributeName="width" from="0" to="96.25" dur="1.2s" begin="0.44999999999999996s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="350" y="152" font-family="Fira Code, monospace" font-size="12" fill="#8ea9b8">14%</text>
    <text x="0" y="184" font-family="Fira Code, monospace" font-size="13" fill="#c9d6de">Other</text>
    <rect x="120" y="168" width="220" height="22" rx="5" fill="#0d2230"/>
    <rect x="120" y="168" height="22" rx="5" fill="#8ea9b8" width="0">
      <animate attributeName="width" from="0" to="68.75" dur="1.2s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="350" y="184" font-family="Fira Code, monospace" font-size="12" fill="#8ea9b8">10%</text>
